<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windows Desktop Mimic</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="./favicon/site.webmanifest" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Desktop Shell -->
    <main class="desktop-shell">
      <!-- Desktop Area -->
      <section class="desktop-area">
        <!-- Desktop Icons -->
        <section class="desktop-icons"></section>

        <!-- Context Layer -->
        <section class="context-layer">
          <section class="context-menu desktop-context-menu">
            <button type="button" class="context-item">
              <i class="ri-refresh-line"></i>
              <span>Refresh</span>
            </button>

            <button type="button" class="context-item">
              <i class="ri-layout-grid-line"></i>
              <span>View</span>
            </button>

            <button type="button" class="context-item">
              <i class="ri-folder-add-line"></i>
              <span>New</span>
            </button>

            <div class="context-divider"></div>

            <button type="button" class="context-item">
              <i class="ri-settings-3-line"></i>
              <span>Personalize</span>
            </button>
          </section>
        </section>

        <!-- Overlay Layer -->
        <section class="overlay-layer">
          <!-- Start Menu -->
          <section class="panel bg start-menu">
            <!-- Search -->
            <section class="start-search">
              <button
                type="button"
                class="start-search-button"
                aria-label="Search"
              >
                <i class="ri-search-line"></i>
              </button>

              <input
                type="text"
                class="start-search-input"
                placeholder="Search for apps, settings and documents"
              />
            </section>

            <!-- Pinned Section -->
            <section class="start-section">
              <header class="section-header">
                <h2 class="section-title">Pinned</h2>

                <button type="button" class="section-action">
                  All<i class="ri-arrow-right-s-line"></i>
                </button>
              </header>

              <section class="start-grid">
                <button type="button" class="start-app">
                  <div class="start-app-icon"></div>

                  <span class="start-app-name"> Explorer </span>
                </button>

                <button type="button" class="start-app">
                  <div class="start-app-icon"></div>

                  <span class="start-app-name"> Browser </span>
                </button>
              </section>
            </section>

            <!-- Recommended Section -->
            <section class="start-section">
              <header class="section-header">
                <h2 class="section-title">Recommended</h2>

                <button type="button" class="section-action">
                  More<i class="ri-arrow-right-s-line"></i>
                </button>
              </header>

              <section class="recommended-list">
                <button type="button" class="recommended-item">
                  <div class="recommended-icon"></div>

                  <section class="recommended-content">
                    <span class="recommended-title"> Project.png </span>

                    <span class="recommended-meta"> Yesterday </span>
                  </section>
                </button>
                <button type="button" class="recommended-item">
                  <div class="recommended-icon"></div>

                  <section class="recommended-content">
                    <span class="recommended-title"> Project.png </span>

                    <span class="recommended-meta"> Yesterday </span>
                  </section>
                </button>
              </section>
            </section>

            <!-- Start Footer -->
            <footer class="start-footer">
              <button type="button" class="profile-trigger">
                <div class="profile-avatar"></div>

                <span class="profile-name"> Username </span>
              </button>

              <button
                type="button"
                class="power-trigger"
                aria-label="Power Options"
              >
                <i class="ri-shut-down-line"></i>
              </button>
            </footer>
          </section>

          <!-- Tray Panel -->
          <section class="panel bg tray-panel">
            <!-- Tray Grid -->
            <section class="tray-grid">
              <button type="button" class="tray-item">
                <div class="tray-icon"></div>
              </button>
              <button type="button" class="tray-item">
                <div class="tray-icon"></div>
              </button>
              <button type="button" class="tray-item">
                <div class="tray-icon"></div>
              </button>
              <button type="button" class="tray-item">
                <div class="tray-icon"></div>
              </button>
            </section>
          </section>

          <!-- Language Panel -->
          <section class="panel bg language-panel">
            <!-- Language Header -->
            <header class="language-header">
              <h2 class="language-title">Keyboard Layout</h2>
              <span class="language-shortcut"> Space </span>
            </header>

            <!-- Language List -->
            <section class="language-list">
              <!-- Active -->
              <button type="button" class="language-item active-language" data-language="ENG IN">
                <div class="language-indicator"></div>
                <section class="language-content">
                  <span class="language-name"> English (India) </span>
                  <span class="language-region"> ENG </span>
                </section>
              </button>

              <!-- Non-Active -->
              <button type="button" class="language-item" data-language="ENG US">
                <div class="language-indicator"></div>
                <section class="language-content">
                  <span class="language-name"> English (US) </span>
                  <span class="language-region"> ENG </span>
                </section>
              </button>
            </section>

            <!-- Language Footer -->
            <footer class="language-footer">
              <button type="button" class="language-settings-trigger">
                Language Settings
              </button>
            </footer>
          </section>

          <!-- Action Panel -->
          <section class="panel bg quick-action-panel">
            <!-- Action Grid -->
            <section class="action-grid">
              <button
                type="button"
                class="action-item active-action"
                data-action="wifi"
              >
                <i class="ri-wifi-line"></i>
                <span class="action-label">Wi-Fi</span>
              </button>
              <button
                type="button"
                class="action-item active-action"
                data-action="bluetooth"
              >
                <i class="ri-bluetooth-line"></i>
                <span class="action-label"> Bluetooth </span>
              </button>
              <button type="button" class="action-item" data-action="focus">
                <i class="ri-moon-clear-line"></i>
                <span class="action-label"> Focus </span>
              </button>
            </section>

            <!-- Brightness -->
            <section class="action-slider-group">
              <header class="slider-header">
                <i class="ri-sun-line"></i>
                <span>Brightness</span>
              </header>
              <input
                type="range"
                class="action-slider"
                data-slider="brightness"
                min="20"
                max="100"
                value="100"
              />
            </section>

            <!-- volume -->
            <section class="action-slider-group">
              <header class="slider-header">
                <i class="ri-volume-up-line"></i>
                <span>Volume</span>
              </header>
              <input
                type="range"
                class="action-slider"
                data-slider="volume"
                min="0"
                max="100"
                value="100"
              />
            </section>

            <!-- Action Footer -->
            <footer class="action-footer">
              <!-- Battery -->
              <section class="battery-status">
                <i class="ri-battery-fill"></i>

                <span class="battery-level"> 100% </span>
              </section>

              <!-- Settings -->
              <button
                type="button"
                class="action-settings-trigger"
                aria-label="Open Settings"
              >
                <i class="ri-settings-3-line"></i>
              </button>
            </footer>
          </section>

          <!-- Notification Panel -->
          <section class="panel notification-panel">
            <!-- Notification Area -->
            <section class="notification-section bg">
              <!-- Notification Header -->
              <header class="notification-header">
                <h2 class="notification-title">Notifications</h2>
                <button type="button" class="notification-clear-trigger">
                  <i class="ri-notification-off-line"></i>
                </button>
              </header>

              <!-- Empty State -->
              <section class="notification-empty-state">
                <span>No new notification</span>
              </section>
            </section>

            <!-- calendar Area -->
            <section class="calendar-section bg" data-calendar-expanded="true">
              <!-- calendar Header -->
              <header class="calendar-header">
                <section class="calendar-date-info">
                  <span class="calendar-day-name"> Monday </span>
                  <span class="calendar-full-date"> 4 May </span>
                </section>

                <button type="button" class="calendar-collapse-trigger">
                  <i class="ri-arrow-down-s-line"></i>
                </button>
              </header>

              <!-- Month Header -->
              <section class="calendar-month-header">
                <button
                  type="button"
                  class="calendar-nav-trigger"
                  data-direction="previous"
                >
                  <i class="ri-arrow-left-s-line"></i>
                </button>
                <span class="calendar-month-label"> May 2026 </span>
                <button
                  type="button"
                  class="calendar-nav-trigger"
                  data-direction="next"
                >
                  <i class="ri-arrow-right-s-line"></i>
                </button>
              </section>

              <!-- Week Days -->
              <section class="calendar-weekdays">
                <span>Su</span>
                <span>Mo</span>
                <span>Tu</span>
                <span>We</span>
                <span>Th</span>
                <span>Fr</span>
                <span>Sa</span>
              </section>

              <!-- calendar Grid -->
              <section class="calendar-grid">
                <button type="button" class="calendar-day muted-day">26</button>
                <button type="button" class="calendar-day active-day">4</button>
                <button type="button" class="calendar-day">5</button>
              </section>

              <!-- calendar Footer -->
              <footer class="calendar-footer">
                <section class="focus-time">
                  <button
                    type="button"
                    class="focus-time-trigger"
                    data-action="decrease"
                  >
                    -
                  </button>
                  <span class="focus-duration">30 mins</span>
                  <button
                    type="button"
                    class="focus-time-trigger"
                    data-action="increase"
                  >
                    +
                  </button>
                </section>
                <button type="button" class="focus-trigger">Focus</button>
              </footer>
            </section>
          </section>

          <!-- Focus Panel -->
          <section class="panel focus-modal">
            <section class="focus-modal-content bg">
              <span class="focus-session-label"> Focus Session </span>
              <span class="focus-countdown"> 30:00 </span>

              <section class="focus-controls">
                <button type="button" class="focus-stop-trigger">stop</button>
                <button type="button" class="focus-reset-trigger">Reset</button>
                <button type="button" class="focus-cancel-trigger">
                  Cancel
                </button>
              </section>
            </section>
          </section>
        </section>
      </section>

      <!-- Taskbar -->
      <footer class="taskbar">
        <!-- Left Side -->
        <section class="taskbar-left">
          <!-- Future Functionality -->
        </section>

        <!-- Right Side -->
        <section class="taskbar-center">
          <!-- Start -->
          <button
            type="button"
            class="taskbar-item start-trigger"
            aria-label="Open Start Menu"
          >
            <i class="ri-microsoft-fill"></i>
          </button>

          <!-- Search -->
          <form class="taskbar-search">
            <button type="submit" class="search-submit" aria-label="Search">
              <i class="ri-search-line"></i>
            </button>
            <input type="text" class="search-input" placeholder="Search" />
          </form>

          <!-- Pinned Apps -->
          <nav class="taskbar-apps">
            <button type="button" class="taskbar-item" data-app="default">
              <img src="./images/task-View.png" alt="task view" />
            </button>
            <button type="button" class="taskbar-item" data-app="pinned">
              <img src="./images/folder.png" alt="folder" />
            </button>
            <button type="button" class="taskbar-item" data-app="pinned">
              <img src="./images/brave.png" alt="brave" />
            </button>
          </nav>
        </section>

        <!-- Right Side -->
        <section class="taskbar-right">
          <!-- Hidden Tray -->
          <button
            type="button"
            class="taskbar-item tray-trigger"
            aria-label="Open Tray Panel"
          >
            <i class="ri-arrow-up-s-line"></i>
          </button>

          <!-- Language -->
          <button
            type="button"
            class="taskbar-item language-trigger"
            aria-label="Open Language Panel"
          >
            <span>ENG</span>
            <span>IN</span>
          </button>

          <!-- Quick Actions -->
          <button
            type="button"
            class="taskbar-item quick-action-trigger"
            aria-label="Open Quick Actions Panel"
          >
            <i class="ri-wifi-line"></i>
            <i class="ri-volume-up-line"></i>
            <i class="ri-battery-fill"></i>
            <span class="taskbar-battery-level">100%</span>
          </button>

          <!-- Notification -->
          <button
            type="button"
            class="taskbar-item notification-trigger"
            aria-label="Open Notification Panel"
          >
            <span class="taskbar-time">05:31 PM</span>

            <span class="taskbar-date"> 22-04-2026 </span>
          </button>

          <!-- Show Desktop -->
          <button
            type="button"
            class="show-desktop-trigger"
            aria-label="Show Desktop"
          ></button>
        </section>
      </footer>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js"></script>
  </body>
</html>
