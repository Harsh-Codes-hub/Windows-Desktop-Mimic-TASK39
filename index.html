<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windows Desktop Mimic</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="./favicon/site.webmanifest" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Desktop Shell -->
    <main class="desktop-shell">
      <!-- Desktop Area -->
      <section class="desktop-area">
        <!-- Desktop Icons -->
        <section class="desktop-icons"></section>

        <!-- Context Layer -->
        <section class="context-layer"></section>

        <!-- Overlay Layer -->
        <section class="overlay-layer">
          <!-- Start Menu -->
          <section class="panel start-menu">
            <!-- Search -->
            <section class="start-search">
              <button
                type="button"
                class="start-search-button"
                aria-label="Search"
              >
                <i class="ri-search-line"></i>
              </button>

              <input
                type="text"
                class="start-search-input"
                placeholder="Search for apps, settings and documents"
              />
            </section>

            <!-- Pinned Section -->
            <section class="start-section">
              <header class="section-header">
                <h2 class="section-title">Pinned</h2>

                <button type="button" class="section-action">
                  All<i class="ri-arrow-right-s-line"></i>
                </button>
              </header>

              <section class="start-grid">
                <button type="button" class="start-app">
                  <div class="start-app-icon"></div>

                  <span class="start-app-name"> Explorer </span>
                </button>

                <button type="button" class="start-app">
                  <div class="start-app-icon"></div>

                  <span class="start-app-name"> Browser </span>
                </button>
              </section>
            </section>

            <!-- Recommended Section -->
            <section class="start-section">
              <header class="section-header">
                <h2 class="section-title">Recommended</h2>

                <button type="button" class="section-action">
                  More<i class="ri-arrow-right-s-line"></i>
                </button>
              </header>

              <section class="recommended-list">
                <button type="button" class="recommended-item">
                  <div class="recommended-icon"></div>

                  <section class="recommended-content">
                    <span class="recommended-title"> Project.png </span>

                    <span class="recommended-meta"> Yesterday </span>
                  </section>
                </button>
                <button type="button" class="recommended-item">
                  <div class="recommended-icon"></div>

                  <section class="recommended-content">
                    <span class="recommended-title"> Project.png </span>

                    <span class="recommended-meta"> Yesterday </span>
                  </section>
                </button>
              </section>
            </section>

            <!-- Start Footer -->
            <footer class="start-footer">
              <button type="button" class="profile-trigger">
                <div class="profile-avatar"></div>

                <span class="profile-name"> Username </span>
              </button>

              <button
                type="button"
                class="power-trigger"
                aria-label="Power Options"
              >
                <i class="ri-shut-down-line"></i>
              </button>
            </footer>
          </section>

          <!-- Tray Panel -->
          <section class="panel tray-panel">

            <!-- Tray Grid -->
             <section class="tray-grid">
              <button type="button" class="tray-item">
                <div class="tray-icon"></div>
              </button>
              <button type="button" class="tray-item">
                <div class="tray-icon"></div>
              </button>
              <button type="button" class="tray-item">
                <div class="tray-icon"></div>
              </button>
              <button type="button" class="tray-item">
                <div class="tray-icon"></div>
              </button>
             </section>

          </section>

          <!-- Language Panel -->
          <section class="panel language-panel">
            <!-- Language Header -->
            <header class="language-header">
              <h2 class="language-title">Keyboard Layout</h2>
              <span class="language-shortcut"> Space </span>
            </header>

            <!-- Language List -->
            <section class="language-list">
              <!-- Active -->
              <button type="button" class="language-item active-language">
                <div class="language-indicator"></div>
                <section class="language-content">
                  <span class="language-name"> English (India) </span>
                  <span class="language-region"> ENG </span>
                </section>
              </button>

              <!-- Non-Active -->
              <button type="button" class="language-item">
                <div class="language-indicator"></div>
                <section class="language-content">
                  <span class="language-name"> English (US) </span>
                  <span class="language-region"> ENG </span>
                </section>
              </button>
            </section>

            <!-- Language Footer -->
            <footer class="language-footer">
              <button type="button" class="language-settings-trigger">
                Language Settings
              </button>
            </footer>
          </section>

          <!-- Action Panel -->
          <section class="panel quick-action-panel">
            <!-- Action Grid -->
            <section class="action-grid">
              <button type="button" class="action-item active-action">
                <i class="ri-wifi-line"></i>
                <span class="action-label">Wi-Fi</span>
              </button>
              <button type="button" class="action-item active-action">
                <i class="ri-bluetooth-line"></i>

                <span class="action-label"> Bluetooth </span>
              </button>
              <button type="button" class="action-item">
                <i class="ri-moon-clear-line"></i>

                <span class="action-label"> Focus </span>
              </button>
            </section>

            <!-- Brightness -->
            <section class="action-slider-group">
              <header class="slider-header">
                <i class="ri-sun-line"></i>
                <span>Brightness</span>
              </header>
              <input type="range" class="action-slider" />
            </section>

            <!-- volume -->
            <section class="action-slider-group">
              <header class="slider-header">
                <i class="ri-volume-up-line"></i>
                <span>Volume</span>
              </header>
              <input type="range" class="action-slider" />
            </section>

            <!-- Action Footer -->
            <footer class="action-footer">
              <!-- Battery -->
              <section class="battery-status">
                <i class="ri-battery-fill"></i>

                <span class="battery-level"> 100% </span>
              </section>

              <!-- Settings -->
              <button
                type="button"
                class="action-settings-trigger"
                aria-label="Open Settings"
              >
                <i class="ri-settings-3-line"></i>
              </button>
            </footer>
          </section>

          <!-- Notification Panel -->
          <section class="panel notification-panel"></section>
        </section>
      </section>

      <!-- Taskbar -->
      <footer class="taskbar">
        <!-- Left Side -->
        <section class="taskbar-left">
          <!-- Future Functionality -->
        </section>

        <!-- Right Side -->
        <section class="taskbar-center">
          <!-- Start -->
          <button
            type="button"
            class="taskbar-item start-trigger"
            aria-label="Open Start Menu"
          >
            <i class="ri-microsoft-fill"></i>
          </button>

          <!-- Search -->
          <form class="taskbar-search">
            <button type="submit" class="search-submit" aria-label="Search">
              <i class="ri-search-line"></i>
            </button>
            <input type="text" class="search-input" placeholder="Search" />
          </form>

          <!-- Pinned Apps -->
          <nav class="taskbar-apps">
            <button type="button" class="taskbar-item" data-app="default">
              <img src="./images/task-View.png" alt="task view" />
            </button>
            <button type="button" class="taskbar-item" data-app="pinned">
              <img src="./images/folder.png" alt="folder" />
            </button>
            <button type="button" class="taskbar-item" data-app="pinned">
              <img src="./images/brave.png" alt="brave" />
            </button>
          </nav>
        </section>

        <!-- Right Side -->
        <section class="taskbar-right">
          <!-- Hidden Tray -->
          <button
            type="button"
            class="taskbar-item tray-trigger"
            aria-label="Open Tray Panel"
          >
            <i class="ri-arrow-up-s-line"></i>
          </button>

          <!-- Language -->
          <button
            type="button"
            class="taskbar-item language-trigger"
            aria-label="Open Language Panel"
          >
            <span>ENG</span>
            <span>IN</span>
          </button>

          <!-- Quick Actions -->
          <button
            type="button"
            class="taskbar-item quick-action-trigger"
            aria-label="Open Quick Actions Panel"
          >
            <i class="ri-wifi-line"></i>
            <i class="ri-volume-up-line"></i>
            <i class="ri-battery-fill"></i>
            <span>100%</span>
          </button>

          <!-- Notification -->
          <button
            type="button"
            class="taskbar-item notification-trigger"
            aria-label="Open Notification Panel"
          >
            <span class="taskbar-time">05:31 PM</span>

            <span class="taskbar-date"> 22-04-2026 </span>
          </button>

          <!-- Show Desktop -->
          <button
            type="button"
            class="show-desktop-trigger"
            aria-label="Show Desktop"
          ></button>
        </section>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
